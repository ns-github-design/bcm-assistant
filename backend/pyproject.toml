[project]
name = "bcm-ghcp-backend"
version = "0.1.0"
description = "BCM/DR & FinOps Assessment Agent - Backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sse-starlette>=2.0",
    "httpx>=0.27.0",
    "github-copilot-sdk==0.2.0",
    "azure-identity>=1.17.0",
    "azure-mgmt-resource>=23.0",
    "azure-mgmt-compute>=32.0",
    "azure-mgmt-network>=26.0",
    "azure-mgmt-storage>=21.0",
    "azure-mgmt-web>=7.0",
    "azure-mgmt-keyvault>=10.0",
    "azure-mgmt-rdbms>=10.0",
    "azure-mgmt-redis>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
