server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;  # needed for React Router
    }

    location /api/ {
        proxy_pass https://bcm-pl-backend.lemonisland-e4eed65a.westus2.azurecontainerapps.io;
        proxy_set_header Host bcm-pl-backend.lemonisland-e4eed65a.westus2.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_http_version 1.1; 
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}