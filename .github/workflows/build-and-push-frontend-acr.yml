name: Build and Push Frontend to ACR

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build-and-push-frontend-acr.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: bcmpilotlight
  ACR_LOGIN_SERVER: bcmpilotlight.azurecr.io

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Set tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build frontend image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/bcm-ghcp-frontend:latest ./frontend
            # \
            # -t $ACR_LOGIN_SERVER/bcm-ghcp-frontend:${{ steps.tags.outputs.short_sha }} \
            # ./frontend

      - name: Push frontend image
        run: |
          docker push $ACR_LOGIN_SERVER/bcm-ghcp-frontend:latest
          # docker push $ACR_LOGIN_SERVER/bcm-ghcp-frontend:${{ steps.tags.outputs.short_sha }}